name: build

on:
  push:
    branches: [main, 'gabzi/**']
    tags: ['v*']
  pull_request:

jobs:
  test-and-build:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Install MAUI Android workload
        run: dotnet workload install maui-android
      - name: Restore
        run: dotnet restore PKForge.sln
      - name: Test
        run: |
          dotnet test tests/PKForge.Domain.Tests/PKForge.Domain.Tests.csproj --no-restore --configuration Release
          dotnet test tests/PKForge.Engine.Tests/PKForge.Engine.Tests.csproj --no-restore --configuration Release
      - name: Decode permanent release signing key
        if: github.ref_type == 'tag'
        env:
          PKFORGE_ANDROID_KEYSTORE_BASE64: ${{ secrets.PKFORGE_ANDROID_KEYSTORE_BASE64 }}
          EXPECTED_CERT_SHA256: ${{ vars.PKFORGE_RELEASE_CERT_SHA256 }}
        run: |
          expected="${EXPECTED_CERT_SHA256//[[:space:]]/}"
          if [[ -z "$expected" ]]; then
            echo "Repository variable PKFORGE_RELEASE_CERT_SHA256 is empty. Set it to the release certificate's SHA-256 fingerprint before tagging."
            exit 1
          fi
          if [[ ! "$expected" =~ ^([0-9A-F]{2}:){31}[0-9A-F]{2}$ ]]; then
            echo "PKFORGE_RELEASE_CERT_SHA256 must be the SHA-256 exactly as keytool prints it: uppercase hex pairs separated by colons (AA:BB:...), 32 bytes."
            exit 1
          fi
          if [[ -z "$PKFORGE_ANDROID_KEYSTORE_BASE64" ]]; then
            echo "Permanent release signing secret is missing."
            exit 1
          fi
          printf '%s' "$PKFORGE_ANDROID_KEYSTORE_BASE64" | base64 --decode > "${RUNNER_TEMP}/pkforge-release.p12"
      - name: Build Android APK
        shell: bash
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/pkforge-release.p12
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.PKFORGE_ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.PKFORGE_ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.PKFORGE_ANDROID_KEY_PASSWORD }}
        run: |
          # Non-tag builds are diagnostic builds: they embed their assemblies (a plain
          # Debug APK relies on Fast Deployment and aborts when sideloaded) and use the
          # .debug app ID, so they install beside the release instead of over it.
          configuration="Debug"
          signing_args=(-p:AndroidKeyStore=false -p:DiagnosticBuild=true)
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            configuration="Release"
            signing_args=(
              -p:AndroidKeyStore=true
              -p:AndroidSigningKeyStore="$ANDROID_KEYSTORE_PATH"
              -p:AndroidSigningStorePass="$ANDROID_KEYSTORE_PASSWORD"
              -p:AndroidSigningKeyAlias="$ANDROID_KEY_ALIAS"
              -p:AndroidSigningKeyPass="$ANDROID_KEY_PASSWORD"
            )
          fi
          dotnet build src/PKForge.App/PKForge.App.csproj --no-restore \
            --configuration "$configuration" -f net10.0-android "${signing_args[@]}"
      - name: Locate APK
        id: apk
        run: |
          apk=$(find src/PKForge.App/bin -name '*-Signed.apk' | head -1)
          echo "path=$apk" >> "$GITHUB_OUTPUT"
          echo "name=PKForge-Fork-${GITHUB_REF_NAME}.apk" >> "$GITHUB_OUTPUT"
      - name: Verify APK package and launcher label
        env:
          APK_PATH: ${{ steps.apk.outputs.path }}
        run: |
          # ApplicationTitle only reaches android:label when the manifest template has none,
          # so check what the built APK really declares.
          sdk="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          aapt2=$(find "$sdk/build-tools" -name aapt2 -type f 2>/dev/null | sort -V | tail -1)
          if [[ -z "$aapt2" ]]; then
            echo "aapt2 not found under '$sdk/build-tools'; cannot check the APK label."
            exit 1
          fi
          package="io.github.gabzidevs.pkforge"
          label="PKForge Fork"
          if [[ "$GITHUB_REF_TYPE" != "tag" ]]; then
            package="$package.debug"
            label="PKForge Fork Diagnostics"
          fi
          badging=$("$aapt2" dump badging "$APK_PATH")
          echo "$badging" | grep -E "^(package:|application-label:)"
          echo "$badging" | grep -Fq "package: name='$package'" \
            || { echo "APK package is not $package."; exit 1; }
          echo "$badging" | grep -Fxq "application-label:'$label'" \
            || { echo "APK application label is not '$label'."; exit 1; }
      - name: Verify permanent release signature
        if: github.ref_type == 'tag'
        env:
          EXPECTED_CERT_SHA256: ${{ vars.PKFORGE_RELEASE_CERT_SHA256 }}
        run: |
          expected="${EXPECTED_CERT_SHA256//[[:space:]]/}"
          if [[ -z "$expected" ]]; then
            echo "Repository variable PKFORGE_RELEASE_CERT_SHA256 is empty. Set it to the release certificate's SHA-256 fingerprint before tagging."
            exit 1
          fi
          if [[ ! "$expected" =~ ^([0-9A-F]{2}:){31}[0-9A-F]{2}$ ]]; then
            echo "PKFORGE_RELEASE_CERT_SHA256 must be the SHA-256 exactly as keytool prints it: uppercase hex pairs separated by colons (AA:BB:...), 32 bytes."
            exit 1
          fi
          line=$(keytool -printcert -jarfile "${{ steps.apk.outputs.path }}" | tr -d '\r' | grep -m1 'SHA256:')
          echo "$line"
          actual="${line#*SHA256:}"
          actual="${actual//[[:space:]]/}"
          if [[ "$actual" != "$expected" ]]; then
            echo "Signing certificate mismatch."
            echo "  expected: $expected"
            echo "  actual:   $actual"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: github.ref_type != 'tag'
        with:
          name: pkforge-apk
          path: ${{ steps.apk.outputs.path }}
          retention-days: 3
      - name: Stage release asset
        if: github.ref_type == 'tag'
        run: cp "${{ steps.apk.outputs.path }}" "PKForge-Fork-${GITHUB_REF_NAME}.apk"
      - name: Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: PKForge-Fork-${{ github.ref_name }}.apk
          generate_release_notes: true
